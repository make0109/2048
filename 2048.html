<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #2b2438;
    --board-bg: #3a3148;
    --cell-empty: #453b56;
    --text-light: #f4efe6;
    --text-dark: #382f45;
    --gold: #f0b429;
    --muted: #b3a8c4;
    --panel: #362c44;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    color: var(--text-light);
    font-family:'Sora', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px 14px;
  }

  .wrap{
    width:100%;
    max-width: 400px;
  }

  .top-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom: 16px;
  }

  h1{
    font-size: 2.2rem;
    font-weight:800;
    margin:0;
    letter-spacing: 0.5px;
  }

  h1 span{ color: var(--gold); }

  .subtitle{
    font-size: 0.82rem;
    color: var(--muted);
    margin: 2px 0 0 0;
  }

  .scores{
    display:flex;
    gap: 8px;
  }

  .score-box{
    background: var(--panel);
    border-radius: 8px;
    padding: 6px 14px;
    text-align:center;
    min-width: 64px;
  }

  .score-box .label{
    font-size: 0.62rem;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  .score-box .value{
    font-size: 1.15rem;
    font-weight:700;
  }

  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 14px;
  }

  .hint{
    font-size: 0.8rem;
    color: var(--muted);
  }

  .new-game-btn{
    padding: 9px 18px;
    background: var(--gold);
    color: #3a2a08;
    border:none;
    border-radius: 7px;
    font-family:'Sora', sans-serif;
    font-weight:700;
    font-size: 0.85rem;
    cursor:pointer;
  }

  .new-game-btn:hover{ opacity:0.88; }

  .board-frame{
    position:relative;
    background: var(--board-bg);
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 14px 32px rgba(0,0,0,0.4);
    touch-action: none;
  }

  .board{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
    aspect-ratio: 1;
  }

  .cell-bg{
    background: var(--cell-empty);
    border-radius: 7px;
  }

  .tiles-layer{
    position:absolute;
    inset: 10px;
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
    pointer-events:none;
  }

  .tile{
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius: 7px;
    font-weight:800;
    animation: pop 0.14s ease;
  }

  @keyframes pop{
    from{ transform: scale(0.55); opacity: 0.3; }
    to{ transform: scale(1); opacity: 1; }
  }

  .overlay{
    position:absolute;
    inset: 10px;
    background: rgba(43,36,56,0.88);
    border-radius: 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 10px;
    text-align:center;
    padding: 20px;
  }

  .overlay.hidden{ display:none; }

  .overlay h2{
    font-size: 1.5rem;
    margin:0;
  }

  .overlay p{
    margin:0;
    color: var(--muted);
    font-size: 0.88rem;
  }

  .overlay button{
    margin-top: 6px;
    padding: 10px 24px;
    background: var(--gold);
    color: #3a2a08;
    border:none;
    border-radius: 7px;
    font-family:'Sora', sans-serif;
    font-weight:700;
    font-size: 0.9rem;
    cursor:pointer;
  }

  .keep-going{
    background: transparent !important;
    color: var(--text-light) !important;
    border: 1.5px solid var(--muted) !important;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="top-row">
    <div>
      <h1>20<span>48</span></h1>
      <p class="subtitle">Бірдей сандарды біріктір, 2048-ге жет</p>
    </div>
    <div class="scores">
      <div class="score-box">
        <div class="label">ҰПАЙ</div>
        <div class="value" id="scoreVal">0</div>
      </div>
      <div class="score-box">
        <div class="label">РЕКОРД</div>
        <div class="value" id="bestVal">0</div>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <span class="hint">← ↑ → ↓ немесе саусақпен сырғыт</span>
    <button class="new-game-btn" id="newGameBtn">Жаңа ойын</button>
  </div>

  <div class="board-frame" id="boardFrame">
    <div class="board" id="cellsBg"></div>
    <div class="tiles-layer" id="tilesLayer"></div>

    <div class="overlay hidden" id="winOverlay">
      <h2>Жеттің! 🎉</h2>
      <p>2048 санын құрадың. Жалғастыра беруге болады.</p>
      <button class="keep-going" id="keepGoingBtn">Жалғастыру</button>
    </div>

    <div class="overlay hidden" id="overOverlay">
      <h2>Бос орын қалмады</h2>
      <p>Соңғы ұпай: <span id="finalScore">0</span></p>
      <button id="tryAgainBtn">Қайта бастау</button>
    </div>
  </div>
</div>

<script>
(function(){
  const cellsBg = document.getElementById('cellsBg');
  const tilesLayer = document.getElementById('tilesLayer');
  const scoreVal = document.getElementById('scoreVal');
  const bestVal = document.getElementById('bestVal');
  const newGameBtn = document.getElementById('newGameBtn');
  const winOverlay = document.getElementById('winOverlay');
  const overOverlay = document.getElementById('overOverlay');
  const keepGoingBtn = document.getElementById('keepGoingBtn');
  const tryAgainBtn = document.getElementById('tryAgainBtn');
  const finalScoreEl = document.getElementById('finalScore');
  const boardFrame = document.getElementById('boardFrame');

  const SIZE = 4;
  const BEST_KEY = '2048_best';

  const TILE_STYLES = {
    2:    { bg:'#efe6d8', color:'#3a2f22' },
    4:    { bg:'#e8d9bd', color:'#3a2f22' },
    8:    { bg:'#eab676', color:'#3a2308' },
    16:   { bg:'#e79b5a', color:'#fff' },
    32:   { bg:'#e2793f', color:'#fff' },
    64:   { bg:'#de5f3b', color:'#fff' },
    128:  { bg:'#d64560', color:'#fff' },
    256:  { bg:'#c93d76', color:'#fff' },
    512:  { bg:'#b23a94', color:'#fff' },
    1024: { bg:'#8b3fc9', color:'#fff' },
    2048: { bg:'#f0b429', color:'#3a2a08' }
  };
  const DEFAULT_STYLE = { bg:'#6a3fd6', color:'#fff' };

  let grid, score, best, wonShown, gameOver, keepGoing;

  function emptyGrid(){
    return Array.from({length: SIZE}, () => Array(SIZE).fill(0));
  }

  function loadBest(){
    try{
      const v = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
      return isNaN(v) ? 0 : v;
    }catch(e){ return 0; }
  }

  function saveBest(v){
    try{ localStorage.setItem(BEST_KEY, String(v)); }catch(e){}
  }

  function buildCellsBg(){
    cellsBg.innerHTML = '';
    for(let i = 0; i < SIZE * SIZE; i++){
      const d = document.createElement('div');
      d.className = 'cell-bg';
      cellsBg.appendChild(d);
    }
  }

  function randomEmptyCell(){
    const empties = [];
    for(let r = 0; r < SIZE; r++)
      for(let c = 0; c < SIZE; c++)
        if(grid[r][c] === 0) empties.push([r,c]);
    if(empties.length === 0) return null;
    return empties[Math.floor(Math.random() * empties.length)];
  }

  function spawnTile(){
    const cell = randomEmptyCell();
    if(!cell) return;
    const [r,c] = cell;
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  function startGame(){
    grid = emptyGrid();
    score = 0;
    wonShown = false;
    gameOver = false;
    keepGoing = false;
    best = loadBest();
    spawnTile();
    spawnTile();
    winOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
    render();
  }

  function slideLine(line){
    let arr = line.filter(v => v !== 0);
    let gained = 0;
    for(let i = 0; i < arr.length - 1; i++){
      if(arr[i] === arr[i+1]){
        arr[i] *= 2;
        gained += arr[i];
        arr[i+1] = 0;
        i++;
      }
    }
    arr = arr.filter(v => v !== 0);
    while(arr.length < SIZE) arr.push(0);
    return { line: arr, gained };
  }

  function linesEqual(a, b){
    return a.every((v,i) => v === b[i]);
  }

  function move(dir){
    if(gameOver) return;
    let moved = false;
    let totalGain = 0;
    const newGrid = emptyGrid();

    if(dir === 'left' || dir === 'right'){
      for(let r = 0; r < SIZE; r++){
        let row = grid[r].slice();
        if(dir === 'right') row.reverse();
        const { line, gained } = slideLine(row);
        totalGain += gained;
        let finalLine = line;
        if(dir === 'right') finalLine = line.slice().reverse();
        if(!linesEqual(finalLine, grid[r])) moved = true;
        newGrid[r] = finalLine;
      }
    } else {
      for(let c = 0; c < SIZE; c++){
        let col = [];
        for(let r = 0; r < SIZE; r++) col.push(grid[r][c]);
        if(dir === 'down') col.reverse();
        const { line, gained } = slideLine(col);
        totalGain += gained;
        let finalCol = line;
        if(dir === 'down') finalCol = line.slice().reverse();
        for(let r = 0; r < SIZE; r++){
          if(finalCol[r] !== grid[r][c]) moved = true;
          newGrid[r][c] = finalCol[r];
        }
      }
    }

    if(!moved) return;

    grid = newGrid;
    score += totalGain;
    if(score > best){
      best = score;
      saveBest(best);
    }
    spawnTile();
    render();
    checkGameState();
  }

  function checkGameState(){
    if(!wonShown && !keepGoing){
      for(let r = 0; r < SIZE; r++)
        for(let c = 0; c < SIZE; c++)
          if(grid[r][c] === 2048){
            wonShown = true;
            winOverlay.classList.remove('hidden');
            return;
          }
    }

    const hasEmpty = grid.some(row => row.some(v => v === 0));
    if(hasEmpty) return;

    for(let r = 0; r < SIZE; r++){
      for(let c = 0; c < SIZE; c++){
        const v = grid[r][c];
        if(c < SIZE - 1 && grid[r][c+1] === v) return;
        if(r < SIZE - 1 && grid[r+1][c] === v) return;
      }
    }

    gameOver = true;
    finalScoreEl.textContent = score;
    overOverlay.classList.remove('hidden');
  }

  function render(){
    tilesLayer.innerHTML = '';
    for(let r = 0; r < SIZE; r++){
      for(let c = 0; c < SIZE; c++){
        const v = grid[r][c];
        if(v === 0) continue;
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.style.gridColumnStart = c + 1;
        tile.style.gridRowStart = r + 1;
        const style = TILE_STYLES[v] || DEFAULT_STYLE;
        tile.style.background = style.bg;
        tile.style.color = style.color;
        tile.style.fontSize = v >= 1024 ? '1.3rem' : (v >= 128 ? '1.5rem' : '1.75rem');
        tile.textContent = v;
        tilesLayer.appendChild(tile);
      }
    }
    scoreVal.textContent = score;
    bestVal.textContent = best;
  }

  newGameBtn.addEventListener('click', startGame);
  tryAgainBtn.addEventListener('click', startGame);
  keepGoingBtn.addEventListener('click', () => {
    keepGoing = true;
    winOverlay.classList.add('hidden');
  });

  window.addEventListener('keydown', (e) => {
    const map = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down' };
    if(map[e.key]){
      e.preventDefault();
      move(map[e.key]);
    }
  }, { passive:false });

  let touchStartX = 0, touchStartY = 0;
  boardFrame.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive:true });

  boardFrame.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    const absX = Math.abs(dx), absY = Math.abs(dy);
    if(Math.max(absX, absY) < 24) return;
    if(absX > absY){
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
  }, { passive:true });

  buildCellsBg();
  startGame();
})();
</script>

</body>
</html>
